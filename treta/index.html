/* ---------- game state ---------- */
const DT={imp:{r:6,hp:24,sp:.85,dm:5,yd:.035,fv:7},brute:{r:11,hp:90,sp:.5,dm:12,yd:.09,fv:14},fly:{r:6,hp:18,sp:1.1,dm:4,yd:.03,fv:9}};
const WN=['SWORD','DHANUSH (BOW)','AGNI ASTRA','DIVYASTRA'];
const CT=['DEEP IN A SERENE FOREST, A WISE RISHI PERFORMS HIS YAGNA AND MEDITATION. BUT FOR YEARS, DEMONS HAVE HAUNTED THE SACRED FIRE, DISRUPTING HIS RITES.','TROUBLED, THE RISHI TRAVELS TO THE GREAT CITY OF AYODHYA AND SEEKS AUDIENCE WITH THE KING, BEGGING FOR HIS HELP.','THE KING AGREES. HE OFFERS HIS ELDEST SON, A YOUNG WARRIOR PRINCE, TO GUARD THE RISHI AGAINST THE DEMONS.','THE PRINCE AND THE RISHI SET OUT FOR THE FOREST. THE DEMONS WILL COME FROM ALL SIDES. PROTECT THE RISHI!'];
let st='title',t=0,ct=0,card=0,ptr=null,keys={},fl=0,shake=0,msg='',mt=0,Pz,D,A,FX,yag,prog,fav,kills,tm,spT,bt,cause;
function reset(){Pz={x:AX,y:AY+40,vx:0,vy:0,hp:100,d:1,inv:0,cd:0,ac:0,sw:0,sa:0,tier:0,w:0};D=[];A=[];FX=[];yag=100;prog=0;fav=0;kills=0;tm=0;spT=60;bt=600;cause='';msg='';mt=0}
reset();
function fx(x,y,n,c,sp,l){for(let i=0;i<n;i++){const a=R()*6.283,v=sp*R();FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l,m:l,c,s:.8+R()*1.4})}}
function nearest(x,y,r){let b=null,bd=r;D.forEach(e=>{const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;b=e}});return b}
function hit(e,dm){e.hp-=dm;e.f=6;fx(e.x,e.y-8,4,'#ff6040',1.5,16);beep(140,.05,'sawtooth')}
function spawn(){const sc=tm/60,r=R(),k=sc>25&&r<.15?'brute':sc>50&&r<.4?'fly':'imp',e=Math.floor(R()*4);
  D.push({k,x:e==0?-12:e==1?W+12:R()*W,y:e==2?-12:e==3?H+12:R()*H,f:0,ph:R()*6,kx:0,ky:0,dr:1,...DT[k],mh:DT[k].hp})}
function upgrade(){if(Pz.tier<3){Pz.tier++;msg='THE RISHI IS PLEASED. HE GRANTS YOU '+WN[Pz.tier];fav=25}else{Pz.hp=Math.min(100,Pz.hp+30);yag=Math.min(100,yag+20);msg='THE RISHI BLESSES YOU. HEALTH RESTORED';fav=0}mt=240;fl=.8;[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle'),i*100))}
function update(){
  t++;if(fl>0)fl-=.04;if(shake>0)shake-=.4;if(mt>0)mt--;
  if(t%5==0)FX.push({x:AX+R()*10-5,y:AY-6,vx:(R()-.5)*.3,vy:-.5-R()*.4,l:55,m:55,c:'#ffb040',s:1});
  FX=FX.filter(p=>{p.x+=p.vx;p.y+=p.vy;return--p.l>0});
  if(st!=='play')return;
  tm++;prog+=100/9000;const P=Pz;let dx=0,dy=0;
  if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;
  if(ptr){dx=ptr.x-P.x;dy=ptr.y-P.y;const l=Math.hypot(dx,dy);if(l>4){dx/=l;dy/=l}else dx=dy=0}else{const l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l}}
  P.vx+=(dx*1.7-P.vx)*.15;P.vy+=(dy*1.7-P.vy)*.15;P.x=Math.max(8,Math.min(W-8,P.x+P.vx));P.y=Math.max(40,Math.min(H-4,P.y+P.vy));

  if(P.tier>0&&P.ac<=0){const n=nearest(P.x,P.y,140);if(n){const a0=Math.atan2(n.y-(P.y-11),n.x-P.x);(P.tier>2?[-.2,0,.2]:[0]).forEach(o=>A.push({x:P.x,y:P.y-11,vx:Math.cos(a0+o)*5,vy:Math.sin(a0+o)*5,dm:[0,13,20,20][P.tier],pc:P.tier>1,h:[],l:50}));P.ac=[0,36,30,26][P.tier];beep(520,.05,'triangle')}}
