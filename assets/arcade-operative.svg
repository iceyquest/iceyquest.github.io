  <ellipse cx="202" cy="136" rx="3.5" ry="4.3" fill="#17242a"/>
  <circle cx="159" cy="134" r="1.1" fill="#fff3d5"/>
  <circle cx="203" cy="134" r="1.1" fill="#fff3d5"/>
