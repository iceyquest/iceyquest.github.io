<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="title description">
  <title id="title">Retro noir operative portrait</title>
  <desc id="description">An original short-haired woman in a teal noir coat and amber scarf, holding two silver sci-fi sidearms against a transparent background.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2c8a4"/>
      <stop offset=".52" stop-color="#c88f70"/>
      <stop offset="1" stop-color="#88564d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5f2e7"/>
      <stop offset=".38" stop-color="#a8c4c0"/>
      <stop offset=".62" stop-color="#e4ddd0"/>
      <stop offset="1" stop-color="#596d75"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#315d62"/>
      <stop offset=".48" stop-color="#17383f"/>
      <stop offset="1" stop-color="#0b1c28"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6a342"/>
      <stop offset="1" stop-color="#a94730"/>
    </linearGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".7" fill="#ffe5b8" opacity=".22"/>
      <circle cx="6" cy="6" r=".55" fill="#09121b" opacity=".35"/>
    </pattern>
    <filter id="shadow" x="-.25" y="-.2" width="1.5" height="1.5">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <ellipse cx="180" cy="376" rx="125" ry="15" fill="#02060b" opacity=".55" filter="url(#shadow)"/>

  <!-- Raised arms, gloves, and original compact sidearms -->
  <path d="m114 244-38-25-24-48 21-14 35 46 40 22zm132 0 38-25 24-48-21-14-35 46-40 22z" fill="url(#coat)" stroke="#66827e" stroke-width="3"/>
  <path d="m57 178-12-5-5-12 8-7 11 1 11 12-4 14zm246 0 12-5 5-12-8-7-11 1-11 12 4 14z" fill="#392f36" stroke="#171c24" stroke-width="2"/>
  <path d="m49 156-9-5-1-12 7-5-3-18 7-7 8 4 3 19 9 10-7 13z" fill="url(#metal)" stroke="#42535b" stroke-width="3"/>
  <path d="m311 156 9-5 1-12-7-5 3-18-7-7-8 4-3 19-9 10 7 13z" fill="url(#metal)" stroke="#42535b" stroke-width="3"/>
  <path d="m47 134 16 3m-17-22 13 3m238 16-16 3m17-22-13 3" stroke="#fff3d4" stroke-width="3" opacity=".88"/>
  <path d="m58 158 12 5-5 13-13-5zm244 0-12 5 5 13 13-5z" fill="#b85d36" stroke="#302a30" stroke-width="2"/>
  <path d="m63 169 6 4m228-4-6 4" stroke="#f4b65d" stroke-width="2"/>

  <!-- Coat, shoulders, lapels -->
  <path d="M111 221q19-19 48-23h42q29 4 48 23l44 46 22 133H45l22-133z" fill="url(#coat)" stroke="#66827e" stroke-width="3"/>
  <path d="m127 216 53 24 53-24 18 31-44 66h-54l-44-66z" fill="#d2d7ca"/>
