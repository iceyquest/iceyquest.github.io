<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="title description">
  <title id="title">Retro noir operative portrait</title>
  <desc id="description">An original bald, angry character in a black suit, white shirt, and red tie, raising two silver pistols.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c9a7"/>
      <stop offset=".48" stop-color="#c99473"/>
      <stop offset="1" stop-color="#80564d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f6"/>
      <stop offset=".36" stop-color="#aeb6c1"/>
      <stop offset=".58" stop-color="#eef0f1"/>
      <stop offset="1" stop-color="#626b7a"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#353744"/>
      <stop offset=".45" stop-color="#1b1d29"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="tie" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0444a"/>
      <stop offset="1" stop-color="#851c2c"/>
    </linearGradient>
    <filter id="shadow" x="-.3" y="-.2" width="1.6" height="1.6">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <ellipse cx="180" cy="370" rx="122" ry="17" fill="#03040a" opacity=".55" filter="url(#shadow)"/>

