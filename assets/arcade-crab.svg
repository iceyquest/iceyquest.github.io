<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-labelledby="title description">
  <title id="title">Retro pixel-art crab</title>
  <desc id="description">An original bright green crab with orange eyes, raised claws, and articulated legs, rendered in a detailed retro game style.</desc>
  <defs>
    <linearGradient id="shell" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#b6ff62"/>
      <stop offset=".38" stop-color="#54d743"/>
      <stop offset=".72" stop-color="#159c4a"/>
      <stop offset="1" stop-color="#07563e"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5ff76"/>
      <stop offset=".48" stop-color="#56dc47"/>
      <stop offset="1" stop-color="#138549"/>
    </linearGradient>
    <linearGradient id="underside" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a1e55a"/>
      <stop offset="1" stop-color="#347c3e"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff9942"/>
      <stop offset="1" stop-color="#d94122"/>
    </linearGradient>
    <pattern id="pixelTexture" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M1 1h3v3H1zM8 7h2v2H8z" fill="#e2ff91" opacity=".17"/>
      <path d="M5 9h2v2H5z" fill="#073f36" opacity=".19"/>
    </pattern>
    <filter id="softShadow" x="-.25" y="-.25" width="1.5" height="1.6">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <ellipse cx="180" cy="304" rx="105" ry="15" fill="#02070a" opacity=".42" filter="url(#softShadow)"/>

  <!-- Raised pincers -->
  <g stroke="#073c32" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="m105 171-36-40-18-43 13-7 29 38 29 20z" fill="url(#claw)"/>
    <path d="m255 171 36-40 18-43-13-7-29 38-29 20z" fill="url(#claw)"/>
    <path d="m68 111-28-9-13-25 7-24 19 12 13-25 13 9-6 28 16 15z" fill="url(#claw)"/>
    <path d="m292 111 28-9 13-25-7-24-19 12-13-25-13 9 6 28-16 15z" fill="url(#claw)"/>
    <path d="m45 82 22 17m247-17-22 17" fill="none" stroke="#dcff9a" stroke-width="5"/>
  </g>
  <path d="m60 107-12-25m252 25 12-25" stroke="#e9ffad" stroke-width="4" opacity=".8"/>
  <path d="m77 135 20 21m186-21-20 21" stroke="#0a633f" stroke-width="4"/>

  <!-- Walking legs -->
  <g fill="none" stroke="#07533b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="m98 196-34 7-29 30-17 1"/>
    <path d="m92 218-35 22-18 33-18 7"/>
    <path d="m108 239-23 32-6 26-18 11"/>
    <path d="m262 196 34 7 29 30 17 1"/>
    <path d="m268 218 35 22 18 33 18 7"/>
    <path d="m252 239 23 32 6 26 18 11"/>
  </g>
  <g fill="none" stroke="url(#claw)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="m99 193-34 7-29 30-18 1"/>
    <path d="m93 215-35 22-18 33-18 7"/>
    <path d="m109 236-23 32-6 26-18 11"/>
    <path d="m261 193 34 7 29 30 18 1"/>
    <path d="m267 215 35 22 18 33 18 7"/>
    <path d="m251 236 23 32 6 26 18 11"/>
  </g>
  <g fill="#c8ff78" stroke="#07533b" stroke-width="4">
    <circle cx="65" cy="200" r="7"/><circle cx="58" cy="237" r="7"/><circle cx="86" cy="268" r="7"/>
    <circle cx="295" cy="200" r="7"/><circle cx="302" cy="237" r="7"/><circle cx="274" cy="268" r="7"/>
  </g>

  <!-- Main shell and segmented underside -->
  <path d="M82 187q7-66 50-83 48-23 96 0 43 17 50 83l-12 44q-16 43-86 49-70-6-86-49z" fill="url(#shell)" stroke="#064535" stroke-width="9"/>
  <path d="M86 188q9-57 50-76 44-21 88 0 41 19 50 76-5 41-42 61-30 17-52 17t-52-17q-37-20-42-61z" fill="url(#pixelTexture)"/>
  <path d="M101 216q79 27 158 0l-11 20q-27 21-68 23-41-2-68-23z" fill="url(#underside)" stroke="#07533b" stroke-width="5"/>
  <path d="M122 231q58 18 116 0m-99 17q41 13 82 0m-57 11v-13m26 13v-13" fill="none" stroke="#d7ff89" stroke-width="4" opacity=".72"/>
  <path d="M101 177q14-46 55-58m103 58q-14-46-55-58" fill="none" stroke="#d7ff9a" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <path d="m113 150 8-11m118 11-8-11m-91-22 8-7m66 7-8-7" stroke="#ecffab" stroke-width="4" opacity=".9"/>

  <!-- Eye stalks and lively eyes -->
  <path d="m147 124 1-22m65 22-1-22" stroke="#07533b" stroke-width="9" stroke-linecap="round"/>
  <path d="m148 123 1-21m63 21-1-21" stroke="#baff70" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#064535" stroke-width="6">
    <ellipse cx="148" cy="91" rx="20" ry="22" fill="url(#eye)"/>
    <ellipse cx="212" cy="91" rx="20" ry="22" fill="url(#eye)"/>
  </g>
  <ellipse cx="151" cy="91" rx="7" ry="12" fill="#121d1b"/>
  <ellipse cx="209" cy="91" rx="7" ry="12" fill="#121d1b"/>
  <circle cx="153" cy="86" r="3.5" fill="#fff5c3"/>
  <circle cx="211" cy="86" r="3.5" fill="#fff5c3"/>
  <path d="m131 80 14-7m84 7-14-7" stroke="#d8ff87" stroke-width="4"/>

  <!-- Pixel highlights and edge glints -->
  <path d="M102 164h8v8h-8zm18-24h6v6h-6zm124 0h6v6h-6zm15 24h8v8h-8zM93 190h7v7h-7zm167 0h7v7h-7z" fill="#edffae" opacity=".88"/>
  <path d="m42 64 7-12m269 12-7-12M23 239h12m290 0h12M61 306l13-8m212 8-13-8" stroke="#c7ff75" stroke-width="4" stroke-linecap="square"/>
</svg>
