</style></head><body>
<canvas id="c" width="768" height="432"></canvas>
<p>MOVE: MOUSE, TOUCH, ARROWS OR WASD<br>EAT TO LIVE. EVOLVE. [M] MUTATE. [P] SAVES.</p>

let S,F,P,Z,G=[],state='title',t=0,ptr=null,keys={},flash=0,tgt=null,toast='',tt=0;
const c=id=>S.mu.filter(m=>m===id).length;
function init(){S={x:0,y:0,vx:0,vy:0,d:1,hp:100,xp:0,s:0,genes:0,mu:[],cause:''};F=[];P=[];Z=[];G=[]}
init();
let ac;function beep(f,d=.06){try{ac=ac||new AudioContext();const o=ac.createOscillator(),v=ac.createGain();o.type='square';o.frequency.value=f;v.gain.value=.03;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const R=Math.random,ring=(a,b)=>{const q=R()*6.28,d=a+R()*(b-a);return[S.x+Math.cos(q)*d,S.y+Math.sin(q)*d]};
const need=()=>7+S.s;
function fill(){
  while(F.length<16){const[x,y]=ring(30,210);F.push({x,y})}
  while(P.length<3+(S.s>>1)){const[x,y]=ring(150,230);P.push({x,y,vx:0,vy:0,hp:40,a:R()*6.28})}
  while(Z.length<3+(S.s>>2)){const[x,y]=ring(80,250);Z.push({x,y,r:16+R()*14,vx:(R()-.5)*.3,vy:(R()-.5)*.3})}
}
function update(){
  t++;
  if(flash>0)flash-=.03;if(tt>0)tt--;
  if(state!=='play')return;
  let dx=0,dy=0;
  if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;
  if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;
  if(ptr){dx=ptr.x-W/2;dy=ptr.y-H/2}
  const l=Math.hypot(dx,dy);
  if(l>6||!ptr&&l>0){dx/=l;dy/=l}else dx=dy=0;
  const sp=1.5*(1+.15*c('wings')+.3*c('legs'));
  S.vx+=(dx*sp-S.vx)*.1;S.vy+=(dy*sp-S.vy)*.1;S.x+=S.vx;S.y+=S.vy;
  if(dx)S.d=dx>0?1:-1;
  fill();if(!G.length&&t%900==0){const[x,y]=ring(60,180);G.push({x,y})}
  const rad=RAD[S.s],er=4+c('tent')*8,dm=Math.pow(.5,c('armor')),hz=Math.pow(.35,c('wings'));
  S.hp-=.035;tgt=null;
  F=F.filter(f=>{
    let ex=S.x-f.x,ey=S.y-f.y,d=Math.hypot(ex,ey)||1;
    if(c('eyes')&&d<50+c('eyes')*30){f.x+=ex/d*.8;f.y+=ey/d*.8}
    if(d<rad+er){S.hp=Math.min(100,S.hp+14);S.xp+=1+.5*c('brain');beep(300+R()*200,.04);return false}
    return d<280;
  });
  G=G.filter(o=>{const d=Math.hypot(S.x-o.x,S.y-o.y);if(d<rad+8){S.genes++;say('+1 GENE');beep(880,.15);return false}return d<320});
  const fr=60+20*c('fire'),sc=S.s;
  P=P.filter(p=>{
    const ex=S.x-p.x,ey=S.y-p.y,d=Math.hypot(ex,ey)||1,pr=RAD[sc]*1.7;
    const v=1.05+.05*sc;
    if(d<130+sc*5){p.vx=ex/d*v;p.vy=ey/d*v}
    else{if(t%90==0)p.a=R()*6.28;p.vx=Math.cos(p.a)*.4;p.vy=Math.sin(p.a)*.4}
    p.x+=p.vx;p.y+=p.vy;
    if(d<rad+pr*.8){S.hp-=.55*dm;S.cause='DEVOURED BY A '+PR[sc];flash=.3}
    if(c('fire')&&d<fr){p.hp-=.9;tgt=p;if(p.hp<=0){for(let i=0;i<3;i++)F.push({x:p.x+R()*20-10,y:p.y+R()*20-10});S.xp+=2;beep(120,.2);return false}}
    p.d=p.vx<0?-1:1;
    return d<320;
  });
  Z=Z.filter(z=>{
    z.x+=z.vx;z.y+=z.vy;
    const d=Math.hypot(S.x-z.x,S.y-z.y);
    if(d<z.r+rad*.6){S.hp-=.3*hz;S.cause='DESTROYED BY '+HZ[sc]}
    return d<340;
  });
  if(S.hp<=0){state='dead';beep(70,.6)}
  else if(S.xp>=need()){
    flash=1;
    if(S.s>=6){state='end';beep(880,.5)}
    else{S.s++;S.xp=0;S.hp=100;S.genes++;F=[];P=[];Z=[];G=[];say('EVOLVED: '+SN[S.s]+'  +1 GENE');[330,440,550].forEach((f,k)=>setTimeout(()=>beep(f,.1),k*80))}
  }
}
const lit=(col,k)=>{const q=[1,3,5].map(i=>parseInt(col.substr(i,2),16));return'rgb('+q.map(v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))))).join(',')+')'};
const ell=(x,y,a,b,col)=>{a=Math.max(1,a);b=Math.max(1,b);if(/^#[0-9a-f]{6}$/i.test(col)){const gr=g.createRadialGradient(x-a*.35,y-b*.4,Math.min(a,b)*.1,x,y,Math.max(a,b)*1.05);gr.addColorStop(0,lit(col,.45));gr.addColorStop(.55,col);gr.addColorStop(1,lit(col,-.45));g.fillStyle=gr}else g.fillStyle=col;g.beginPath();g.ellipse(x,y,a,b,0,0,6.283);g.fill()};
const glow=(x,y,r,col,a,m='lighter')=>{const c0=lit(col,0),gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c0);gr.addColorStop(1,c0.replace('rgb','rgba').replace(')',',0)'));g.save();g.globalCompositeOperation=m;g.globalAlpha=a;g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore()};

const fish=(u,a,b)=>{ell(0,0,2.4*u,1.2*u,a);for(let k=0;k<u*1.5;k++)rc(-2.3*u-k,-k*.7,1,k*1.4+1,b);rc(0,-1.5*u,u,.5*u,b);rc(1.3*u,-.5*u,.5*u,.5*u,'#fff');rc(1.5*u,-.4*u,.3*u,.3*u,'#000')};
const legs4=(u,col)=>{rc(-1.4*u,.8*u,.5*u,1.1*u,col);rc(1*u,.8*u,.5*u,1.1*u,col)};
const mam=(u,col)=>{ell(0,0,2*u,1.1*u,col);ell(2.1*u,-.5*u,.9*u,.8*u,col);rc(1.9*u,-1.6*u,.4*u,.7*u,col);rc(2.9*u,-.5*u,.4*u,.4*u,'#000');rc(2.3*u,-.9*u,.3*u,.3*u,'#fff');legs4(u,col);rc(-2.6*u,-.6*u,.8*u,.3*u,col)};
const SP=[
 u=>{for(let i=-6;i<=6;i++){const x=i*u*.8,y=Math.sin(i*.9+t*.15)*u*2;if(i%2==0)rc(x,-Math.abs(y),1,Math.abs(y)*2,'#ccf');ell(x,y,u*.6,u*.6,'#44eeff');ell(x,-y,u*.6,u*.6,'#ff55cc')}},
 u=>{ell(0,0,2.3*u,1.7*u,'#77ffee');ell(0,0,2*u,1.4*u,'#aaffff');ell(.4*u,0,.8*u,.7*u,'#ff66aa');for(let k=-4;k<=4;k++){rc(k*u*.5,-2.1*u,1,u*.5,'#77ffee');rc(k*u*.5,1.7*u,1,u*.5,'#77ffee')}},
 u=>fish(u,'#ff9a33','#cc5511'),
 u=>{ell(0,0,2*u,1.1*u,'#44bb44');ell(0,.4*u,1.7*u,.5*u,'#ccff88');ell(1.9*u,-.3*u,u,.8*u,'#44bb44');ell(2*u,-1*u,.4*u,.4*u,'#fff');rc(2.1*u,-1*u,.2*u,.3*u,'#000');legs4(u,'#2a8a2a')},
 u=>{ell(0,0,2.2*u,1.1*u,'#66bb33');for(let k=0;k<9;k++)ell(-2.4*u-k*.45*u,0,u*.6*(1-k/10)+1,u*.5*(1-k/10)+1,'#66bb33');ell(2.5*u,-.3*u,.9*u,.7*u,'#66bb33');for(let k=0;k<4;k++)rc(-1.5*u+k*.8*u,-1.5*u,.3*u,.5*u,'#ee9922');rc(2.8*u,-.6*u,.3*u,.3*u,'#fff');legs4(u,'#4a8a22')},
 u=>mam(u,'#a0703a'),
 u=>{ell(0,-2.4*u,.8*u,.8*u,'#ffcc99');rc(-.8*u,-2.9*u-1,1.6*u,.5*u,'#553311');rc(-.8*u,-1.7*u,1.6*u,2.2*u,'#3388cc');rc(-.7*u,.5*u,.6*u,2*u,'#333366');rc(.1*u,.5*u,.6*u,2*u,'#333366');rc(-1.3*u,-1.6*u,.5*u,1.8*u,'#ffcc99');rc(.8*u,-1.6*u,.5*u,1.8*u,'#ffcc99');rc(.3*u,-2.6*u,.3*u,.3*u,'#000')}];
const PS=[
 u=>{ell(0,0,1.3*u,1.3*u,'#cc3344');for(let k=0;k<8;k++){const a=k*.785;rc(Math.cos(a)*1.6*u,Math.sin(a)*1.6*u,u*.5,u*.5,'#ff6677')}ell(0,0,.5*u,.5*u,'#fff')},
 u=>{ell(0,0,3*u,1.6*u,'#99aabb');ell(0,0,2.6*u,1.2*u,'#bbccdd');for(let k=-5;k<=5;k++){rc(k*u*.5,-1.9*u,1,u*.4,'#99aabb');rc(k*u*.5,1.6*u,1,u*.4,'#99aabb')}rc(1.2*u,0,1.5*u,.4*u,'#aa2233');ell(-1*u,0,.5*u,.4*u,'#556')},
 u=>{fish(u*1.1,'#778899','#556677');rc(1.9*u,.2*u,.3*u,.6*u,'#fff');rc(1.4*u,.2*u,.3*u,.6*u,'#fff')},
 u=>{for(let k=0;k<11;k++)ell(-k*.9*u,Math.sin(k*.8+t*.15)*.8*u,.9*u,.9*u,k%2?'#aa6622':'#ddaa33');rc(.5*u,-.4*u,.4*u,.4*u,'#f22');rc(1.2*u,0,.8*u,1,'#f22')},
 u=>{const f=Math.sin(t*.2)*u*1.5;ell(0,0,1.4*u,.8*u,'#aa5544');g.fillStyle='#cc7766';g.beginPath();g.moveTo(-.5*u,-.5*u);g.lineTo(-2*u,-3*u+f);g.lineTo(-3.5*u,-.5*u-f*.3);g.lineTo(.5*u,-.2*u);g.fill();rc(1.7*u,-1.2*u,.4*u,u,'#aa5544');rc(1.3*u,-.1*u,1.6*u,.3*u,'#ffbb44')},
 u=>{mam(u,'#dd8822');rc(2.9*u,-.1*u,.3*u,u,'#fff')},

const HD=[[0,0],[2,0],[2.8,0],[2.8,-.3],[3.2,-.3],[3,-.5],[.9,-2.6]];
function mutOver(u){
  const dy=S.s==6?-1.6*u:0,[hx,hy]=HD[S.s].map(v=>v*u);
  for(let i=0;i<c('wings');i++){const f=Math.sin(t*.25)*u*.4;ell(-.5*u-i*.8*u,-1.8*u+dy+f-i*.4*u,.6*u,1.8*u,i%2?'#ffeedd':'#eef0ff');ell(-1.3*u-i*.8*u,-1.5*u+dy-f,.5*u,1.4*u,'#ccd4ff')}
  for(let i=0;i<c('armor');i++)for(let k=-2;k<=2;k++)rc(k*u*.8,-1.4*u+dy+i*u*.3,.6*u,.4*u,'#aabbcc');
  for(let i=0;i<c('tent');i++)for(let j=0;j<6;j++)rc(-u+i*u*.9+Math.sin(j+t*.2)*u*.4,1.2*u+j*u*.5,Math.max(2,u*.4),Math.max(2,u*.4),'#ff77aa');
  for(let i=0;i<c('eyes');i++){rc(hx-.3*u+i*u*.7,hy-1.2*u,.5*u,.5*u,'#fff');rc(hx-.1*u+i*u*.7,hy-1*u,.3*u,.3*u,'#f0f')}
  for(let i=0;i<c('legs');i++){rc(-1.1*u+i*u,.8*u,.4*u,1.8*u+u*i,'#555');rc(.8*u,.8*u,.4*u,1.8*u,'#555')}
  for(let i=0;i<c('brain');i++)ell(hx*.4,-1.5*u+dy-i*.5*u,u*1.1,.8*u,'#ff99bb');
  if(c('fire')&&t%6<3)ell(hx+.6*u,hy,.5*u,.4*u,'#ffaa22');

function sprite(fn,x,y,u,d,mu){g.save();g.translate(Math.round(x),Math.round(y));g.globalAlpha=.3;ell(0,u*2.7,u*2.3,u*.5,'#000');g.globalAlpha=1;g.scale(d,1);fn(u);if(mu)mutOver(u);g.restore()}
const txt=(s,x,y,col='#fff',a='center',sz=8)=>{g.fillStyle=col;g.textAlign=a;g.font=sz+'px "Press Start 2P",monospace';g.fillText(s,x,y)};

const hh=n=>{n=Math.sin(n*127.1+311.7)*43758.5;return n-Math.floor(n)};
function tri(x1,y1,x2,y2,x3,y3,col){g.fillStyle=col;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.fill()}

    layer(.3,34,(x,y,r,r2)=>{const h=40+r*70;rc(x,y-h,30,h+20,'#150a2a');for(let j=0;j<h/8;j++)for(let q=0;q<3;q++)if(hh(j*7+q+r*50)>.5)rc(x+4+q*9,y-h+4+j*8,4,4,'#ffdd66');if(r2>.7)rc(x+14,y-h-12,2,12,'#ff3344')})}
  const gc=['','','#0b2a66','#1a4a28','#2a0d08','#eef8ff','#0a0618'][k];if(gc)rc(0,H-10,W,10,gc);
  for(let i=0;i<50;i++){const f=.25+(i%3)*.15,sp=[-.2,-.3,-.45,0,.5,.7,0][k],x=(((i*97)%W-S.x*f+(k==5?Math.sin(t*.03+i)*8:0))%W+W)%W,y=(((i*53)%H-S.y*f+t*sp)%H+H)%H;
    g.globalAlpha=k==3||k==6?.4+.6*Math.abs(Math.sin(t*.04+i)):.85;g.fillStyle=b[2];const z=k==1||k==2?(i%4?2:3):(i%5?1:2);g.fillRect(Math.floor(x),Math.floor(y),z,z)}

}
function mix(a,b,k){const p=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const A=p(a),B=p(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'}

  const ok=S.genes>=2&&S.mu.length<3;rc(W-100,H-34,94,28,ok?'#ffee44':'#334');rc(W-98,H-32,90,24,'#112');
  txt('[M] MUTATE',W-53,H-21,ok?'#ffee44':'#778','center',6);txt('GENES '+S.genes+'  MUT '+S.mu.length+'/3',W-53,H-11,'#ffaaee','center',6);
  if(tt>0)txt(toast,W/2,40,'#ffee44','center',8);
  if(state==='dead'){g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,W,H);txt('EXTINCT',W/2,90,'#ff4444','center',20);txt(S.cause||'STARVED',W/2,116,'#fff');txt('YOU REACHED: '+SN[S.s],W/2,134,'#aaa',"center",6);if(t%60<35)txt('PRESS TO EVOLVE AGAIN',W/2,170)}
  if(state==='mut'){g.fillStyle='rgba(0,0,20,.85)';g.fillRect(0,0,W,H);txt('MUTATION!',W/2,28,'#ffee44','center',14);txt('CHOOSE A GIFT FROM THE GENE POOL',W/2,46,'#aaa','center',6);
    S.opt.forEach((m,i)=>{const x=20+i*122;rc(x,62,110,110,'#334');rc(x+2,64,106,106,'#112');txt(m[2],x+55,86,'#ffaaee','center',8);m[3].split('|').forEach((l,j)=>txt(l,x+55,112+j*14,'#fff','center',6));txt('['+(i+1)+']',x+55,158,'#88ddff','center',8)})}

    const top=Object.keys(END).sort((a,b)=>c(b)-c(a))[0],e=c(top)?END[top]:['THE PURE HUMAN','NO MUTATIONS. JUST EVOLUTION.|PERFECT, SIMPLE, UNBROKEN'];
    for(let i=0;i<24;i++){const a=t*.01+i*.26;rc(W/2+Math.cos(a)*(60+i*2),90+Math.sin(a)*(40+i),2,2,'#ffee88')}
    sprite(SP[6],W/2,92,5,1,true);txt('PINNACLE REACHED',W/2,22,'#ffee44','center',10);txt(e[0],W/2,148,'#ffaaee','center',12);
    e[1].split('|').forEach((l,j)=>txt(l,W/2,166+j*12,'#fff','center',7));if(t%60<35)txt('PRESS TO BEGIN AGAIN',W/2,206,'#88ddff','center',6)}
  if(state!=='menu')savesBtn();

    txt('[P] OR TAP HERE TO CLOSE',W/2,H-12,'#88ddff','center',6);if(tt>0)txt(toast,W/2,38,'#ffee44','center',6)}

const say=s=>{toast=s;tt=150};
let SL=[],mf='title';
try{SL=JSON.parse(localStorage.getItem('molluska_slots'))||[]}catch(e){}
SL=Array.from({length:5},(_,i)=>SL[i]||null);
const persist=()=>{try{localStorage.setItem('molluska_slots',JSON.stringify(SL))}catch(e){}};
function openMenu(){if(state!=='menu'){mf=state;state='menu';ptr=null}}
function closeMenu(){state=mf}
function saveSlot(i){if(mf!=='play')return say('START PLAYING FIRST');SL[i]={s:S.s,xp:S.xp,genes:S.genes,mu:[...S.mu]};persist();say('SAVED TO SLOT '+(i+1));beep(660,.12)}
function loadSlot(i){const d=SL[i];if(!d)return say('SLOT EMPTY');init();Object.assign(S,{s:d.s,xp:d.xp,genes:d.genes,mu:[...d.mu]});state='play';flash=.6;say('LOADED SLOT '+(i+1));beep(440,.12)}
function menuClick(p){if(p.y>H-30)return closeMenu();const i=Math.floor((p.y-44)/28);if(i<0||i>4)return;if(p.x>224&&p.x<292)saveSlot(i);else if(p.x>=294&&p.x<364)loadSlot(i)}
const savesBtn=()=>{rc(W-68,3,64,14,'#334');txt('[P] SAVES',W-36,13,'#ffee44','center',6)};
function mutate(){if(state!=='play')return;if(S.mu.length>=3)return say('MUTATION LIMIT REACHED');if(S.genes<2)return say('NEED 2 GENES');S.genes-=2;const m=MU[Math.floor(R()*MU.length)];S.mu.push(m[0]);flash=.7;say('MUTATED: '+m[2]+'!');beep(520,.2)}
function act(){if(state==='title')state='play';else if(state==='dead'||state==='end'){init();state='play'}else return;beep(440,.1)}
(function loop(){update();draw();requestAnimationFrame(loop)})();
const pos=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H}};
cv.addEventListener('pointerdown',e=>{ptr=pos(e);const p=ptr;if(state==='menu'){menuClick(p);ptr=null}else if(p.x>W-68&&p.y<18){openMenu()}else if(state==='play'&&p.x>W-100&&p.y>H-34){mutate();ptr=null}else act()});
cv.addEventListener('pointermove',e=>{if(state==='play')ptr=pos(e)});
cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')ptr=null});
cv.addEventListener('pointerleave',()=>{ptr=null});
addEventListener('keydown',e=>{const k=e.key.length>1?e.key:e.key.toLowerCase();if(k==='p'||k==='l'||k==='Escape'){state==='menu'?closeMenu():openMenu()}else if(state==='menu'){}else if(k==='m')mutate();else if(state!=='play')act();keys[k]=1;if(k.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.length>1?e.key:e.key.toLowerCase()]=0});
